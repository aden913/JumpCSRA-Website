<!DOCTYPE html>
<html>
<head>
    <title>PayPal Setup Test</title>
</head>
<body>
    <h1>PayPal Plan Setup</h1>
    <button id="setupButton">Create PayPal Plan</button>
    <div id="result"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-functions.js';

        // Your Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyDbzY5p7h1JjQ_7jvONIDPtEGl9GUJ1yV8",
            authDomain: "pppro-b060e.firebaseapp.com",
            databaseURL: "https://pppro-b060e-default-rtdb.firebaseio.com",
            projectId: "pppro-b060e",
            storageBucket: "pppro-b060e.appspot.com",
            messagingSenderId: "726094476994",
            appId: "1:726094476994:web:e38de9f93d4a8fb3b73b5a"
        };

        const app = initializeApp(firebaseConfig);
        const functions = getFunctions(app, 'us-central1');

        document.getElementById('setupButton').addEventListener('click', async () => {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Creating PayPal plan...';

            try {
                const triggerSetup = httpsCallable(functions, 'triggerPayPalSetup');
                const result = await triggerSetup();
                
                resultDiv.innerHTML = `
                    <h2>Success!</h2>
                    <p><strong>Plan ID:</strong> ${result.data.planId}</p>
                    <p><strong>Product ID:</strong> ${result.data.productId}</p>
                    <p><strong>Message:</strong> ${result.data.message}</p>
                `;
                console.log('PayPal setup result:', result.data);
            } catch (error) {
                resultDiv.innerHTML = `<h2>Error:</h2><p>${error.message}</p>`;
                console.error('PayPal setup error:', error);
            }
        });
    </script>
</body>
</html>
